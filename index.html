<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mohan Qiao CV</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <!--
      The document renders from typed per-language content files:
      edit your CV in content/master.<lang>.ts — one file per language,
      registered in src/main.ts. dist/cv.js is the committed bundle
      (`bun run build`), so this page also works from file:// with no
      install; `bun server.ts` serves a live bundle during editing.
      The language toggle is generated automatically and hidden in
      print. Force an edition with ?lang=en / ?lang=fr.
    -->
    <main class="cv" id="cv-root" aria-label="Curriculum vitae"></main>

    <script src="./dist/cv.js"></script>
  </body>
</html>
