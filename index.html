<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mohan Qiao CV</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <!--
      The document is rendered from per-language content files.
      Edit your CV in content/master.<lang>.js — one file per language.
      To add a language: copy a content file, translate it, and add a
      <script> tag below. The language toggle updates automatically
      and is hidden in print, so exported PDFs stay clean.
      Force a language for export or sharing with ?lang=en / ?lang=fr.
    -->
    <main class="cv" id="cv-root" aria-label="Curriculum vitae"></main>

    <script src="./content/master.en.js"></script>
    <script src="./content/master.fr.js"></script>
    <script src="./renderer.js"></script>
  </body>
</html>
