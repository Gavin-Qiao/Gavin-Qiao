name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install type definitions
        run: bun install --frozen-lockfile || bun install

      - name: Typecheck
        run: bun run check

      - name: Build
        run: bun run build

      - name: Bundle is committed and fresh
        run: git diff --exit-code dist/cv.js
