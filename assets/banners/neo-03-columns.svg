<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <rect x="0" y="0" width="160" height="320" fill="#FFFFFF"/>
  <rect x="174" y="0" width="220" height="320" fill="#0055A4"/>
  <rect x="408" y="0" width="280" height="320" fill="#FFFFFF"/>
  <rect y="0" height="320" fill="#E30613">
    <animate attributeName="x" values="702;702;702" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="width" values="180;320;180" dur="3s" repeatCount="indefinite"/>
  </rect>
  <!-- vertical black lines -->
  <rect x="160" y="0" width="14" height="320" fill="#000000"/>
  <rect x="394" y="0" width="14" height="320" fill="#000000"/>
  <rect y="0" width="14" height="320" fill="#000000">
    <animate attributeName="x" values="688;828;688" dur="3s" repeatCount="indefinite"/>
  </rect>
  <!-- yellow horizontal pulse -->
  <rect x="0" fill="#FFCC00">
    <animate attributeName="y" values="244;208;244" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="height" values="36;72;36" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="width" values="1200;1200;1200" dur="3s" repeatCount="indefinite"/>
  </rect>
  <rect x="0" y="0" width="1200" height="320" fill="none" stroke="#000000" stroke-width="14"/>
</svg>
